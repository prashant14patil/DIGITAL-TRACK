<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cg fill='none' stroke='%232457c5' stroke-width='1.8'%3E%3Cellipse cx='10' cy='15' rx='7' ry='2.5'/%3E%3Cpath d='M10 2.5V15'/%3E%3C/g%3E%3Ccircle cx='10' cy='5.5' r='2' fill='%232457c5'/%3E%3C/svg%3E" />
    <title>Digital Track</title>
    <script>
      // Apply the saved theme before first paint (no flash). Same key and values as ThemeSwitch in src/ui.jsx.
      try {
        var t = localStorage.getItem("dt-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
