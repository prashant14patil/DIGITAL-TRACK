[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digitaltrack"
version = "0.2.0"
description = "Geometry-first 360-degree body scanning POC: dataset validation, synthetic data, TSDF reconstruction, measurement"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "open3d",
    "trimesh",
    "shapely",
    "networkx",
    "jsonschema",
    "opencv-contrib-python>=4.8",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
dt = "digitaltrack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: reconstruction tests that take several seconds", "real: validation on real recordings (skipped unless DIGITALTRACK_REAL_UPLOADS is set)"]
